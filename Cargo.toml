[package]
authors = ["ZhangChao <jerry4718@qq.com>"]
edition = "2024"
name = "napi_blitz"
version = "0.2.218"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "node"
path = "src/debug-node.rs"
required-features = ["debug-node"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[features]
default = ["native-window", "vello-hybrid"]
native-window = []
buffer-surface = []
# Gates the `node` proxy bin (src/debug-node.rs) so it is built only when
# explicitly requested: cargo build --features debug-node
debug-node = []

# Renderer backends (pick one at build time)
vello = ["dep:anyrender_vello"]
vello-hybrid = ["dep:anyrender_vello_hybrid"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]
skia = ["dep:anyrender_skia"]
skia-pixels = ["dep:anyrender_skia", "anyrender_skia/pixels_window_renderer"]
skia-softbuffer = ["dep:anyrender_skia", "anyrender_skia/softbuffer_window_renderer"]

[dependencies]
napi = { version = "3.12.2", features = ["napi6", "async"] }
napi-derive = "3.6.3"
winit = "=0.31.0-beta.2"

blitz = { version = "=0.3.0-beta.2", default-features = false, features = ["net"] }
# Depend on blitz-dom directly with `system_fonts` enabled. Cargo unifies
# features across all dependents, so the `blitz` crate's internal
# `blitz-dom` dependency picks up `system_fonts` too. Without this,
# fontique does not register system fonts and text renders as empty boxes.
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["system-fonts"] }
# Stylo / selectors, pinned to the same versions blitz uses so the
# trait impls in blitz-dom's private `stylo` module (which are written
# against `&Node`) line up with the crates we call directly. The stylo
# crate's lib name is `style`, so we import it under that name to match
# blitz's own usage.
style = { version = "0.20.0", package = "stylo" }
selectors = { version = "0.40.0" }

anyrender = { version = "0.13.0" }
anyrender_skia = { version = "0.11.0", optional = true }
anyrender_vello = { version = "0.14.0", optional = true }
anyrender_vello_cpu = { version = "0.17.0", optional = true }
anyrender_vello_hybrid = { version = "0.10.0", optional = true }

parley = { version = "0.11.1", default-features = false, features = ["std"] }
# Avoid pkg-config for cross-compiled Linux/FreeBSD builds. fontique's
# fontconfig-dlopen feature enables yeslogic-fontconfig-sys/dlopen, so the
# native library is loaded at runtime instead of discovered at build time.
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }

# Force icu_provider to use the `log` framework instead of bare `eprintln!`
# in debug builds, so ICU4X data errors can be filtered.
icu_provider = { version = "2.2.0", features = ["logging"] }

rfd = { version = "0.17.1" }
log = "0.4"

# Unify reqwest's TLS feature for Linux builds so openssl-sys builds
# OpenSSL from source instead of trying to locate a target sysroot via pkg-config.
# This covers both musl and cross-compiled GNU targets such as aarch64/armv7.
[target.'cfg(target_os = "linux")'.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["native-tls-vendored"]

[build-dependencies]
napi-build = "2.4.1"

# Release builds use the git source instead of the local path.
# Apply with: cargo build --release (uses [patch.crates-io.git] overrides below)
# To switch: comment out the path patches above and uncomment the git ones.
[patch.crates-io]
blitz = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-dom = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-traits = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-html = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-net = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-paint = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
blitz-shell = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
stylo_taffy = { git = "https://github.com/jerry4718/blitz.git", rev = "83e780fe50a34e92314ad96992d29b5fe9bad7f5" }
#taffy = { git = "https://github.com/jerry4718/taffy.git", rev = "4ae4219b34e0ad22fd907cb1a7fa9a68c1ea1621" }

