[package]
authors = ["ZhangChao <jerry4718@qq.com>"]
edition = "2024"
name = "napi_blitz"
version = "0.0.207"

[lib]
crate-type = ["cdylib"]

[features]
default = ["native-window", "vello-hybrid"]
native-window = []
buffer-surface = []

# Renderer backends (pick one at build time)
vello = ["dep:anyrender_vello"]
vello-hybrid = ["dep:anyrender_vello_hybrid"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]
skia = ["dep:anyrender_skia"]
skia-pixels = ["dep:anyrender_skia", "anyrender_skia/pixels_window_renderer"]
skia-softbuffer = ["dep:anyrender_skia", "anyrender_skia/softbuffer_window_renderer"]

[dependencies]
napi-derive = "3.5.6"
winit = "0.31.0-beta.2"
log = "0.4"

[dependencies.napi]
version = "3.9.3"
features = ["napi6", "async"]

[dependencies.blitz]
version = "=0.3.0-beta.1"
default-features = false
features = ["net"]

# Depend on blitz-dom directly with `system_fonts` enabled. Cargo unifies
# features across all dependents, so the `blitz` crate's internal
# `blitz-dom` dependency picks up `system_fonts` too. Without this,
# fontique does not register system fonts and text renders as empty boxes.
[dependencies.blitz-dom]
version = "=0.3.0-beta.1"
default-features = false
features = ["system-fonts"]

# Stylo / selectors, pinned to the same versions blitz uses so the
# trait impls in blitz-dom's private `stylo` module (which are written
# against `&Node`) line up with the crates we call directly. The stylo
# crate's lib name is `style`, so we import it under that name to match
# blitz's own usage.
[dependencies.style]
version = "0.20.0"
package = "stylo"
[dependencies.selectors]
version = "0.40.0"

[dependencies.anyrender_vello]
version = "0.13.0"
optional = true

[dependencies.anyrender_vello_hybrid]
version = "0.9.0"
optional = true

[dependencies.anyrender_vello_cpu]
version = "0.15.0"
optional = true

[dependencies.anyrender_skia]
version = "0.10.0"
optional = true

[dependencies.parley]
version = "0.10"
default-features = false
features = ["std"]

# Avoid pkg-config for cross-compiled Linux/FreeBSD builds. fontique's
# fontconfig-dlopen feature enables yeslogic-fontconfig-sys/dlopen, so the
# native library is loaded at runtime instead of discovered at build time.
[dependencies.fontique]
version = "0.10.0"
features = ["fontconfig-dlopen"]

# Force icu_provider to use the `log` framework instead of bare `eprintln!`
# in debug builds, so ICU4X data errors can be filtered.
[dependencies.icu_provider]
version = "2.1.1"
features = ["logging"]

# Unify reqwest's TLS feature for Linux builds so openssl-sys builds
# OpenSSL from source instead of trying to locate a target sysroot via pkg-config.
# This covers both musl and cross-compiled GNU targets such as aarch64/armv7.
[target.'cfg(target_os = "linux")'.dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["native-tls-vendored"]

[dependencies.rfd]
version = "0.17.2"

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"


# Release builds use the git source instead of the local path.
# Apply with: cargo build --release (uses [patch.crates-io.git] overrides below)
# To switch: comment out the path patches above and uncomment the git ones.
#
[patch.crates-io]
blitz = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-dom = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-traits = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-html = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-net = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-paint = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
blitz-shell = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }
stylo_taffy = { git = "https://github.com/jerry4718/blitz.git", rev = "a46e9b5402d1047e2636e07eef22ffad46ceb822" }

